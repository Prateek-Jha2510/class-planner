name: Build Android APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - run: npm test
      - name: Generate and sync Android project
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export PLANNER_VERSION="${GITHUB_REF_NAME#v}"
          fi
          npm run android:init
      - name: Use the shared debug signer for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish Class Planner 1.0.0')
        env:
          SIGNER: ${{ secrets.CLASS_PLANNER_DEBUG_KEY_B64 }}
        run: |
          if [[ -n "$SIGNER" ]]; then
            install -d -m 700 "$HOME/.android"
            printf '%s' "$SIGNER" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo "::warning::This release uses a temporary debug key. See README before distributing updates."
          fi
      - name: Assemble APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Class-Planner-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Class-Planner-debug
          path: Class-Planner-debug.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish Class Planner 1.0.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Class-Planner-debug
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Class-Planner-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" Class-Planner-debug.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Class Planner $TAG" --notes "Download Class-Planner-debug.apk under Assets to install on Android."
          fi
